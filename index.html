<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herramientas de gestión</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 60px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 26px; text-align: center; margin-bottom: 4px; }
    .subtitulo { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
    .tarjetas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    @media (max-width: 600px) { .tarjetas { grid-template-columns: repeat(2, 1fr); } }
    .tarjeta {
      position: relative; background: transparent; border: none; border-radius: 10px; padding: 10px;
      text-align: center; text-decoration: none; color: #333; font-weight: bold;
      transition: transform 0.1s;
    }
    .tarjeta:hover { transform: translateY(-2px) scale(1.02); }
    .tarjeta .imagen-completa { width: 100%; max-height: 160px; object-fit: contain; display: block; border: none; outline: none; }
    /* Tooltip */
    .tarjeta::after {
      content: attr(data-tooltip);
      position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, 4px);
      background: #222; color: #fff; font-size: 12px; font-weight: normal; line-height: 1.3;
      padding: 6px 10px; border-radius: 6px; white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 0.15s, transform 0.15s; z-index: 10;
    }
    .tarjeta:hover::after, .tarjeta:focus-visible::after { opacity: 1; transform: translate(-50%, -4px); }
    /* Si falta la imagen, se muestra el nombre */
    .sin-imagen {
      display: flex; align-items: center; justify-content: center; height: 140px;
      border: 2px dashed #bbb; border-radius: 10px; color: #555; font-size: 16px; padding: 0 8px;
    }
    .pie { text-align: center; margin-top: 30px; }
  </style>
</head>
<body>

  <h1>Herramientas de gestión</h1>
  <div class="subtitulo">Selecciona una aplicación</div>

  <div class="tarjetas">
    <a class="tarjeta" href="https://jamanteiga.github.io/ASME/index.html" target="_blank" rel="noopener" data-tooltip="Cálculo de recipientes según código ASME" aria-label="Cálculo de recipientes según código ASME">
      <img class="imagen-completa" src="IMAGES/ASME1.jpg" alt="ASME" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/Documentlist" target="_blank" rel="noopener" data-tooltip="GESDOC – Control documental de proyectos" aria-label="GESDOC – Control documental de proyectos">
      <img class="imagen-completa" src="IMAGES/GESDOC1.jpg" alt="GESDOC" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/ESTRUCTURA" target="_blank" rel="noopener" data-tooltip="ESTRUCTURA – Control de producción naval por bloques" aria-label="ESTRUCTURA – Control de producción naval por bloques">
      <img class="imagen-completa" src="IMAGES/ESTRUCTURA1.jpg" alt="ESTRUCTURA" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/REGHOR" target="_blank" rel="noopener" data-tooltip="REGHOR – Registro de partes de horas" aria-label="REGHOR – Registro de partes de horas">
      <img class="imagen-completa" src="IMAGES/REGHOR1.jpg" alt="REGHOR" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/PIPING" target="_blank" rel="noopener" data-tooltip="PIPING – Cálculo de tuberías" aria-label="PIPING – Cálculo de tuberías">
      <img class="imagen-completa" src="IMAGES/PIPING1.jpg" alt="PIPING" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/RecipientesPresion/index.html" target="_blank" rel="noopener" data-tooltip="Recipientes a presión – Directiva PED 2014/68/UE" aria-label="Recipientes a presión – Directiva PED 2014/68/UE">
      <img class="imagen-completa" src="IMAGES/CE_MARKING_2014_68_CE.jpg" alt="PED 2014/68/CE" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/CONVERUNITS" target="_blank" rel="noopener" data-tooltip="Conversor de unidades" aria-label="Conversor de unidades">
      <img class="imagen-completa" src="IMAGES/CONVERSOR-UNIDADES1.jpg" alt="Conversor de unidades" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/Moody" target="_blank" rel="noopener" data-tooltip="Diagrama de Moody – Factor de fricción" aria-label="Diagrama de Moody – Factor de fricción">
      <img class="imagen-completa" src="IMAGES/MOODY.jpg" alt="Diagrama de Moody" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/LIMPFINC" target="_blank" rel="noopener" data-tooltip="LIMPFINC – Limpieza de fincas" aria-label="LIMPFINC – Limpieza de fincas">
      <img class="imagen-completa" src="IMAGES/LIMPFINC.jpg" alt="Limpieza de fincas" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/PLANTFINC" target="_blank" rel="noopener" data-tooltip="PLANTFINC – Plantación de fincas" aria-label="PLANTFINC – Plantación de fincas">
      <img class="imagen-completa" src="IMAGES/PLANTFINC.jpg" alt="Plantación de fincas" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/VISORCAD" target="_blank" rel="noopener" data-tooltip="VISORCAD – Visor de archivos CAD" aria-label="VISORCAD – Visor de archivos CAD">
      <img class="imagen-completa" src="IMAGES/VISORCAD.jpg" alt="Visor CAD" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/CAD/" target="_blank" rel="noopener" data-tooltip="CAD – Dibujo CAD 2D" aria-label="CAD – Dibujo CAD 2D">
      <img class="imagen-completa" src="IMAGES/CAD.jpg" alt="CAD 2D" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/INV3D" target="_blank" rel="noopener" data-tooltip="INV3D – Visor / modelado 3D" aria-label="INV3D – Visor / modelado 3D">
      <img class="imagen-completa" src="IMAGES/INV3D.jpg" alt="Inventor 3D" onerror="sinImagen(this)">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/EPDF" target="_blank" rel="noopener" data-tooltip="EPDF – Editor de PDF" aria-label="EPDF – Editor de PDF">
      <img class="imagen-completa" src="IMAGES/EPDF.jpg" alt="EPDF Editor PDF" onerror="sinImagen(this)">
    </a>
  </div>

  <script>
    function sinImagen(img) {
      var div = document.createElement('div');
      div.className = 'sin-imagen';
      div.textContent = img.alt;
      img.replaceWith(div);
    }
  </script>

</body>
</html>
