<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herramientas de gestión</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 26px; text-align: center; margin-bottom: 4px; }
    .subtitulo { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
    .tarjetas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .tarjeta {
      background: transparent; border: none; border-radius: 10px; padding: 10px;
      text-align: center; text-decoration: none; color: #333; font-weight: bold;
      transition: transform 0.1s;
    }
    .tarjeta:hover { transform: translateY(-2px) scale(1.02); }
    .tarjeta .imagen-completa { width: 100%; max-height: 160px; object-fit: contain; display: block; border: none; outline: none; }
    .pie { text-align: center; margin-top: 30px; }
  </style>
</head>
<body>

  <h1>Herramientas de gestión</h1>
  <div class="subtitulo">Selecciona una aplicación</div>

  <div class="tarjetas">
    <a class="tarjeta" href="https://jamanteiga.github.io/ASME/index.html" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/ASME1.jpg" alt="ASME">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/Documentlist" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/GESDOC1.jpg" alt="GESDOC">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/ESTRUCTURA" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/ESTRUCTURA1.jpg" alt="ESTRUCTURA">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/REGHOR" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/REGHOR1.jpg" alt="REGHOR">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/PIPING" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/PIPING1.jpg" alt="PIPING">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/RecipientesPresion/index.html" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/CE_MARKING_2014_68_CE.jpg" alt="PED 2014/68/CE">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/CONVERUNITS" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/CONVERSOR-UNIDADES1.jpg" alt="Conversor de unidades">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/Moody" target="_blank" rel="noopener">

    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/LIMPFINC" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/LIMPFINC.jpg" alt="Limpieza de fincas">
    </a>
    <a class="tarjeta" href="https://jamanteiga.github.io/VISORCAD" target="_blank" rel="noopener">
      <img class="imagen-completa" src="IMAGES/VISORCAD.jpg" alt="Visor CAD">
    </a>
  </div>

</body>
</html>
